<text x="490.0" y="756" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="18" font-weight="500" fill="#111827">POST /cases/new?patient_id=...</text>
<line x1="620" y1="840" x2="880" y2="840" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<text x="750.0" y="826" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="18" font-weight="500" fill="#111827">保存病例并自动触发预测</text>
