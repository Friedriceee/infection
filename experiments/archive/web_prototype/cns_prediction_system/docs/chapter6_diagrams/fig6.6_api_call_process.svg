<text x="1530.0" y="1396" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="18" font-weight="500" fill="#111827">时序特征 + 静态风险融合</text>
<line x1="1660" y1="1480" x2="1400" y2="1480" stroke="#374151" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
<text x="1530.0" y="1466" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="18" font-weight="500" fill="#111827">动态修正量/融合风险</text>
<line x1="1400" y1="1550" x2="880" y2="1550" stroke="#374151" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
<text x="1140.0" y="1536" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="18" font-weight="500" fill="#111827">动态预测结果</text>
