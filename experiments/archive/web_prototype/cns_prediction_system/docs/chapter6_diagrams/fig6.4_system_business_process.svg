<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1700" viewBox="0 0 1300 1700">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="650.0" y="54" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="34" font-weight="700" fill="#111827">临床辅助决策原型系统业务流程图</text>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker></defs>
<rect x="440" y="115" width="420" height="70" rx="24" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="650.0" y="158.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#111827">医生登录系统</text>
<line x1="650" y1="185" x2="650" y2="230" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="230" width="420" height="70" rx="24" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="650.0" y="273.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#111827">首页仪表盘</text>
<line x1="650" y1="300" x2="650" y2="345" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="345" width="420" height="96" rx="24" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="650.0" y="388.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#111827">新增/查询患者</text>
<text x="650.0" y="420.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#111827">或Excel批量导入</text>
<line x1="650" y1="441" x2="650" y2="475" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="475" width="420" height="96" rx="24" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="650.0" y="518.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#111827">录入单次病例</text>
<text x="650.0" y="550.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#111827">或动态批量导入</text>
<line x1="650" y1="571" x2="650" y2="610" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="610" width="420" height="70" rx="24" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="650.0" y="653.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#111827">保存检测记录到 cases 表</text>
<line x1="650" y1="680" x2="650" y2="745" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="745" width="420" height="96" rx="24" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="650.0" y="788.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#111827">调用静态 PGA-AMFormer</text>
<text x="650.0" y="820.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#111827">生成基础风险</text>
<line x1="650" y1="841" x2="650" y2="895" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="895" width="420" height="70" rx="24" fill="#f3f4f6" stroke="#4b5563" stroke-width="2"/>
<text x="650.0" y="938.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="24" font-weight="600" fill="#111827">保存静态预测到 predictions 表</text>
<rect x="470" y="1030" width="360" height="120" rx="0" fill="#fff7ed" stroke="#4b5563" stroke-width="3"/>
<text x="650" y="1082" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="25" font-weight="700" fill="#111827">患者病例数 &gt;= 2 ?</text>
<line x1="650" y1="965" x2="650" y2="1030" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="470,1090 250,1090 250,1240" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<text x="360.0" y="1082.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="18" font-weight="400" fill="#6b7280">否</text>
<rect x="70" y="1240" width="360" height="95" rx="24" fill="#dbeafe" stroke="#4b5563" stroke-width="2"/>
<text x="250.0" y="1282.5" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="23" font-weight="600" fill="#111827">仅保留静态风险</text>
<text x="250.0" y="1313.5" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="23" font-weight="600" fill="#111827">不展示趋势图</text>
<polyline points="830,1090 1060,1090 1060,1200" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<text x="945.0" y="1082.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="18" font-weight="400" fill="#6b7280">是</text>
<rect x="880" y="1200" width="360" height="90" rx="24" fill="#e0e7ff" stroke="#4b5563" stroke-width="2"/>
<text x="1060.0" y="1253.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="22" font-weight="600" fill="#111827">读取历史病例</text>
<line x1="1060" y1="1290" x2="1060" y2="1325" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="880" y="1325" width="360" height="90" rx="24" fill="#e0e7ff" stroke="#4b5563" stroke-width="2"/>
<text x="1060.0" y="1365.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="22" font-weight="600" fill="#111827">按检查时间构造</text>
<text x="1060.0" y="1395.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="22" font-weight="600" fill="#111827">多时间点序列</text>
<line x1="1060" y1="1415" x2="1060" y2="1470" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="880" y="1470" width="360" height="90" rx="24" fill="#e0e7ff" stroke="#4b5563" stroke-width="2"/>
<text x="1060.0" y="1510.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="22" font-weight="600" fill="#111827">调用动态 D-PGA-AMFormer</text>
<text x="1060.0" y="1540.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="22" font-weight="600" fill="#111827">输出融合风险</text>
<polyline points="250,1335 250,1600 650,1600" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="1060,1560 1060,1600 650,1600" fill="none" stroke="#374151" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="440" y="1600" width="420" height="90" rx="24" fill="#dcfce7" stroke="#4b5563" stroke-width="2"/>
<text x="650.0" y="1640.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="23" font-weight="700" fill="#111827">更新患者当前风险状态</text>
<text x="650.0" y="1671.0" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, Arial" font-size="23" font-weight="700" fill="#111827">生成报告并支持打印</text>
</svg>